<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · GatherUp</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800\&family=Figtree:wght@400;500;600\&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth">
<div class="auth-side">
  <div class="logo">Gather<span>Up</span></div>
  <div class="pitch">
    <h2>Your campus, one calendar.</h2>
    <ul>
      <li>Browse and register for events in a tap</li>
      <li>Keep every registration in one place</li>
      <li>Create and manage your own events</li>
    </ul>
  </div>
  <small>Campus Events Manager</small>
</div>
<div class="auth-main">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="meta">Log in to see your events and registrations.</p>
    <form id="loginForm">
      <label>Email<input name="email" type="email" autocomplete="email" required autofocus></label>
      <label>Password
        <span class="pw"><input name="password" type="password" autocomplete="current-password" required><button type="button" data-peek aria-pressed="false" aria-label="Show password">Show</button></span>
      </label>
      <label class="check"><input name="remember" type="checkbox"> Keep me logged in on this device</label>
      <p id="err" class="err" role="alert"></p>
      <button class="btn" type="submit">Log in</button>
    </form>
    <p class="switch">New here? <a href="register.html">Create an account</a></p>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>

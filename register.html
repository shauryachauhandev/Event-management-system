<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create account · GatherUp</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800\&family=Figtree:wght@400;500;600\&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="auth">
<div class="auth-side">
  <div class="logo">Gather<span>Up</span></div>
  <div class="pitch">
    <h2>Your campus, one calendar.</h2>
    <ul>
      <li>Browse and register for events in a tap</li>
      <li>Keep every registration in one place</li>
      <li>Create and manage your own events</li>
    </ul>
  </div>
  <small>Campus Events Manager</small>
</div>
<div class="auth-main">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="meta">It takes under a minute. Then you can register for events.</p>
    <form id="regForm">
      <label>Full name<input name="name" type="text" autocomplete="name" required maxlength="60" autofocus></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password
        <span class="pw"><input name="password" type="password" autocomplete="new-password" required minlength="8"><button type="button" data-peek aria-pressed="false" aria-label="Show password">Show</button></span>
        <span class="hint">At least 8 characters.</span>
      </label>
      <label>Confirm password<input name="confirm" type="password" autocomplete="new-password" required></label>
      <p id="err" class="err" role="alert"></p>
      <button class="btn" type="submit">Create account</button>
    </form>
    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<script src="auth.js"></script>
</body>
</html>
